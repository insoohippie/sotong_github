name: sotong_local
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  firebase_core: ^3.15.0
  firebase_auth: ^5.6.1
  cloud_firestore: ^5.6.10
  firebase_storage: ^12.4.8
  firebase_analytics: ^11.5.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  lottie: ^3.3.1
  flutter_keyboard_visibility: ^5.4.1
  nimble_charts: ^0.5.0-beta
  fl_chart:  ^0.68.0
  mrx_charts: ^0.1.3
  syncfusion_flutter_charts: ^31.1.19
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.1.0
  animated_toggle_switch: ^0.8.5
  wheel_picker: ^0.2.2
  flutter_reorderable_grid_view: ^5.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Thin.ttf
          weight: 100
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Pretendard-Light.ttf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.ttf
          weight: 900

  assets:
    - assets/animations/
    - assets/images/
